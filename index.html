<!DOCTYPE html>
<html>
<head>
<title>Arduino UNO Controlling Platform</title>
</head>
<body>

<h1>ESP01 LED Control</h1>

<button onclick="setState(1)">LED ON</button>
<button onclick="setState(0)">LED OFF</button>

<script>
function setState(state)
{
    fetch(
    "https://github.com/nsichowrah/ArduinoUNO.ESP01control/blob/main/state.txt",
    {
      method: "PUT",
      headers:
      {
        "Authorization":"Bearer YOUR_GITHUB_TOKEN",
        "Content-Type":"application/json"
      },
      body: JSON.stringify({})
    });
}
</script>

</body>
</html>
